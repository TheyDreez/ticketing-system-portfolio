<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBI Operations Center</title>
  </head>
  <body><div id="error-log" style="color:red; background:white; position:absolute; z-index:9999;"></div><script>window.onerror = function(msg, url, lineNo, columnNo, error) { document.getElementById("error-log").innerHTML += "<p>" + msg + " " + url + ":" + lineNo + ":" + columnNo + "</p>"; return false; }; window.addEventListener("unhandledrejection", function(event) { document.getElementById("error-log").innerHTML += "<p>" + (event.reason ? event.reason.stack || event.reason : "Promise rejected") + "</p>"; });</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
